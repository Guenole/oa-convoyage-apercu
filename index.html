<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Aperçu du site OA Convoyage</title>
<meta name="description" content="Aperçu animé du futur site d’OA Convoyage, sur ordinateur et sur mobile.">
<link rel="icon" href="nouvelle/assets/svg/icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="apercu.css">
</head>
<body>
<header class="ap-barre">
  <p class="ap-marque"><b>OA Convoyage</b><span>Aperçu du site</span></p>
  <div class="ap-outils">
    <label class="ap-page"><span class="ap-sr">Page affichée</span><select id="ap-page">
      <option value="accueil">Accueil</option>
      <option value="professionnels">Professionnels</option>
      <option value="particuliers">Particuliers</option>
      <option value="a-propos">À propos</option>
      <option value="contact">Contact</option>
      <option value="convoyages">Convoyages</option>
    </select></label>
    <div class="ap-appareil" role="group" aria-label="Affichage">
      <button type="button" data-appareil="ordinateur" aria-pressed="true">Ordinateur</button>
      <button type="button" data-appareil="mobile" aria-pressed="false">Mobile</button>
    </div>
  </div>
</header>

<main class="ap-scene" data-appareil="ordinateur">
  <div class="ap-cadre"><iframe id="ap-site" title="Site OA Convoyage" src="about:blank"></iframe></div>
</main>

<div class="ap-anciennes" role="region" aria-label="Remarques gardées sur cet appareil" hidden>
  <p>Vous aviez noté <b class="ap-anciennes__nb"></b> sur cet appareil avec l’ancien outil. Envoyez-les-nous pour qu’elles ne se perdent pas.</p>
  <div><button type="button" class="ap-anciennes__envoi">Envoyer à HWS</button><button type="button" class="ap-anciennes__copie">Copier</button><button type="button" class="ap-anciennes__x" aria-label="Fermer">×</button></div>
</div>
<p class="ap-toast" role="status" hidden></p>
<script src="apercu.js"></script>
</body>
</html>
